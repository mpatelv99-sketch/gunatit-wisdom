<script type="text/plain" class="chapter" data-title="Twenty-Two Steps of Surrender">
One morning at 5:00 a.m., Yogiji Maharaj gave Prabhudas an agna. He said, “Please go to the fields and tell the farm worker not to harvest the bajri (pearl millets).” Prabhudas immediately went to the field and told him, “Bapa has said that the bajri should not be harvested.” The worker accepted this, and Prabhudas returned to Bapa. Bapa enquired, “Guru, did you tell him?” Prabhudas replied, “Yes, Bapa.” Bapa again instructed, “Go and tell him again, so he does not forget.” Prabhudas went again, and instructed the worker a second time.

At around 5:30 or 5:45am, Bapa sent him once again to remind the worker. Prabhudas went back to the fields and again instructed the worker, “Bapa has said not to harvest the bajri today.” After saying this, Prabhudas returned. At that time, Bapa was going for his bath. Seeing him, Bapa asked, “Guru, did you tell the worker about the bajri?” Prabhudas replied, “Yes.” Bapa said, “He is a laborer. We should tell him again. Go once more.” So, for the fourth time, Prabhudas went and told him, “Bapa has requested that the bajri should not be harvested.”

Consider the situation for a moment. If you tell the same person the same thing three times within just half an hour or forty-five minutes, what would that person’s inner condition be? It was early in the morning, around 5 and 6am. And naturally, this person must wonder: ‘Why does He keep nagging me so early in the morning?’

Prabhudas returned after informing the worker yet again. Bapa had completed His bath and was coming out of the bathroom. Prabhudas was also returning and was about to sit for pooja. Seeing Him, Bapa again said, “Please go once more.” Prabhudas obediently went again. By that evening, Bapa had sent Prabhudas to the farm twenty-one times. When Prabhudas returned for the seventeenth time, the worker became aggressive. He shouted, “I am not deaf! Do you have nothing better to do than repeat the same thing?”

For Prabhudas however, this was His Guru’s agna. When He returned to the temple, Bapa once again said, “Guru, go and tell him about the bajri.” Prabhudas then went for the nineteenth time. On seeing Prabhudas, the worker’s frustration boiled over into a threat: “If you step one foot here again, I will beat you!”

Some time later, Yogiji Maharaj sent Prabhudas for the twentieth time. “Guru, go and tell him.” This time, the worker was also waiting. He must have thought: “Now let him come, I will teach Him a lesson that He’ll never forget.” As soon as Prabhudas reached him, the worker began to beat Him up. Despite the beatings, Prabhudas serenely said: “Bapa has requested that we not cut the bajri.” He gracefully accepted the beatings as prasad.

Prabhudas then returned to Bapa, but didn’t complain about what had occurred. When Bapa saw Prabhudas, He said yet again, “Go, Guru. Tell him one more time.”

How would the ordinary mind react after enduring a physical beating? Most people would never have returned. Prabhudas did not live by human logic. He lived by the words of Yogiji Maharaj. He went again. When Prabhudas went for the twenty-first time, the worker suddenly awakened to what was truly happening. He recognised that Prabhudas wasn’t at fault. With folded hands, he said to Him: “I am sorry for my anger, I understand now that it is Yogiji Maharaj who is orchestrating this divine play between us.”

Through twenty-one walks of steadfast obedience, Prabhudas demonstrated the pinnacle of a true bhagat’s surrender, proving that when an agna is embraced with absolute faith, even the heaviest blows turn into a canvas of divine grace.

## Pause and reflect

Stay with the story for a moment. What is the true miracle of this prasang?

Was it that Prabhudas walked to the field twenty-one times and even risked getting slapped? Or that His inner peace and trust never changed?

- Why do you think Yogiji Maharaj repeated the same instruction again and again?
- What does this prasang show us about the difference between obedience and surrender?

## Make it your own

This is where the prasang becomes your own.

- What am I living by today? My own logic or Guruhari or Bhagvadi’s guidance?
- What is the “twenty-first journey” in my own life? Where do I feel like saying, “Enough. I don’t want to do this anymore.”
- Which instruction from Swamiji have I quietly stopped living because it became difficult, repetitive, or uncomfortable?
- When life becomes unfair, do I continue walking or do I begin questioning?
- What causes me to abandon my spiritual practices more quickly: fatigue, criticism, inconvenience, or disappointment?
- If I truly believed every agna was shaping my soul, how differently would I respond to life’s repeated challenges?

## This week’s practice

Choose one practice for this week.

- Identify one instruction or spiritual practice you have become inconsistent with.
- For seven days, live it wholeheartedly, as your offering to Guruhari.
- Whenever your mind says, “I’ve done enough,” pause and ask: “Can I take one more step?”
- At the end of each day reflect: “Today, did I live by convenience or by commitment?”

## To remember

The highest surrender is to keep walking after the mind has stopped understanding.

## A prayer

O, Guruhari Prabodh Swamiji...

Please grant me the strength to live by Your words rather than by my own changing thoughts. When my mind grows tired, impatient, or discouraged, help me take one more step in faith.

Please teach me to embrace every agna with joy, knowing that each act of surrender shapes my soul.

May I never measure the path by difficulty, but only by the privilege of walking it with You.
</script>

<script type="text/plain" class="chapter" data-title="Beyond Why">
The incident took place while Yogiji Maharaj was staying in the village of Adval.

While travelling, one of the sadhus accompanying Him fell critically ill. Out of deep concern for His disciple’s well-being, Yogiji Maharaj turned to Prabhudas and delivered an agna:

> “Go to the neighboring village and bring our regular doctor here to treat our sadhu.”

Without a second thought, Prabhudas set out on a bicycle, embarking on a seven-mile journey. Upon His arrival, Prabhudas delivered the message, explaining the sadhu’s illness and conveying Yogiji Maharaj’s urgent request. The doctor’s face, however, clouded with anxiety. “My own son is gravely ill at the moment and undergoing treatment,” the doctor replied. “As soon as his condition is stable, I will come.” Prabhudas politely emphasised that Yogiji Maharaj had requested him to come as quickly as possible, but the doctor insisted on tending to his son first.

With no other choice, Prabhudas pedaled seven miles back to Adval to report the situation. By this time He had already covered fourteen miles. As evening gave way to deep night, the doctor had still not appeared.

Summoning Prabhudas once again, Yogiji Maharaj inquired, “Prabhudas, did you actually inform the doctor?”

“Yes, Bapa,” Prabhudas answered gently. “I went and spoke with him face to face.”

“But you must not have insisted enough,” Yogiji Maharaj replied. “Go back right now and make sure you bring a doctor.”

By then, it was the middle of the night. The unpaved rural roads were riddled with deep potholes and cloaked in pitch-black darkness. Riding without a lantern, Prabhudas fell repeatedly along the way, yet He pressed on until He reached the doctor’s house.

When He knocked on the door, the doctor’s wife answered. She delivered some distressing news: “My husband took our son to a hospital in Ahmedabad. The boy developed severe pneumonia and needed emergency treatment.”

With the regular doctor unavailable, Prabhudas looked for an alternative. “Is there another doctor in this village?” He asked. The woman kindly walked with Him down the road to point out the residence of another local physician.

Prabhudas knocked and woke the second doctor from his sleep, urgently explaining the medical crisis back at their camp. This doctor, however, viewed the situation through a purely professional lens. “Who is going to pay my consulting fee?” he demanded.

“We will take care of your payment,” Prabhudas promised. “Please just come with me.”

“Well, my vehicle is currently unavailable,” the doctor countered. “I will come tomorrow morning when my car arrives. I can’t travel tonight.”

With no other options left, Prabhudas hopped back on His bicycle and pedaled seven miles back to Adval through the remaining hours of the night.

By the time He returned, the sun was beginning to rise. As soon as Yogiji Maharaj woke up, Prabhudas briefed Him on everything that had transpired, explaining that the first doctor was away in Ahmedabad, but a second doctor had promised to arrive within the hour.

Yogiji Maharaj looked at Him and asked, “Guru, who is going to pay this new doctor?”

“Bapa, I told him that we would cover the costs,” Prabhudas replied.

The master shook His head softly. “Is that your money? That wealth belongs entirely to Thakorji. We can’t afford a doctor who demands payment in this manner. Go back immediately and tell him not to come.”

This meant another seven miles out and another seven miles back. Without a single word of complaint, Prabhudas simply said, “I will go inform him right away, Bapa.” As Prabhudas turned back onto the grueling road, Bapa gathered the remaining sadhus and devotees. “Let us sit together, do bhajan, and pray for his recovery,” He requested.

When Prabhudas finally returned, having cycled a total of forty-two miles, a remarkable sight awaited Him. The sick sadhu had recovered completely through the power of bhajan.

For most people, such an experience would give rise to endless questions. If Yogiji Maharaj intended to heal the sadhu through prayer, why send Prabhudas on a forty-two-mile journey through the darkness? Why allow Him to endure such hardship?

Prabhudas never asked those questions. His trust was complete. He accepted every instruction without allowing a single doubt to enter His heart. Such was His nishkapat trust and flawless nirdosh buddhi towards His Guru.

Prabhudas did not allow a single negative thought or doubt to even enter His mind.

## Pause and reflect

Pause for a moment. Imagine yourself riding beside Prabhudas through the darkness. Feel the exhaustion, the uncertainty, and the unanswered questions.

What does this prasang reveal about the difference between trusting Guruhari and understanding Guruhari?

## Make it your own

This is where the prasang becomes your own.

- What are the “forty-two miles” in my own life? Which journey has felt exhausting, confusing, or seemingly pointless?
- Is there a situation where I am still asking, “Why did this happen to me?”
- When life doesn’t make sense, do I trust less or do I trust more?
- Which unanswered “why” has prevented me from moving forward spiritually?
- If Swamiji never explained His reasons, would I still joyfully continue walking?
- What would change in my life if I believed that every step, even the ones I don’t understand, was shaping my soul?

## This week’s practice

For the next seven days:

- Whenever your mind asks “Why?”, gently replace it with: “What is Swamiji preparing me for?”
- Think of one difficult journey in your life. Instead of asking why it happened, write down how it has shaped your character.
- Practice accepting one inconvenience each day without complaint, offering it silently to Swamiji.
- Every evening ask yourself: “Did I spend more energy questioning or trusting today?”

## To remember

The soul finds peace when trust reaches beyond understanding.

## A prayer

O, Guruhari Prabodh Swamiji...

Grant me the faith to continue walking, even when I cannot see the purpose of the path.

When my mind searches for explanations, teach my heart to rest in Your wisdom.

Free me from the need to understand everything before I trust.

May every unanswered “why” become another opportunity to deepen my surrender and strengthen my relationship with You.

Help me to walk with joy, knowing that every step guided by You carries a purpose far greater than I can yet see.
</script>

<script>
const BOOK = {
  title: "Divine Lessons of Gunatit Wisdom",
  author: "",
  intro: "One prasang at a time, with questions to sit with and a practice for the week. Take one, then put your phone down.",
  breakEveryMinutes: 15   // gentle “look up” reminder; set to 0 to turn off
};

/* ---------- helpers ---------- */
const $app = document.getElementById('app');
const WPM = 200;
const KEY = 'reader:' + BOOK.title.replace(/\s+/g, '-').toLowerCase();

function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function inline(s) {
  return esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/\*(.+?)\*/g, '<em>$1</em>');
}
function el(html) { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstChild; }

/* ---------- load chapters from the page ---------- */
const chapters = [...document.querySelectorAll('script.chapter')].map((s, i) => {
  const text = s.textContent.trim();
  const words = text.split(/\s+/).length;
  return {
    i,
    title: s.dataset.title || 'Chapter ' + (i + 1),
    reflect: s.dataset.reflect || '',
    text,
    minutes: Math.max(1, Math.round(words / WPM))
  };
});

function bodyHtml(text) {
  return text.split(/\n\s*\n/).map(block => {
    block = block.trim();
    const lines = block.split('\n');
    if (lines.every(l => l.trim().startsWith('- '))) {
      return '<ul>' + lines.map(l => '<li>' + inline(l.trim().slice(2)) + '</li>').join('') + '</ul>';
    }
    if (block.startsWith('## ')) return '<h2>' + inline(block.slice(3)) + '</h2>';
    if (block.startsWith('> ')) {
      const q = block.split('\n').map(l => l.replace(/^>\s?/, '')).join(' ');
      return '<blockquote><p>' + inline(q) + '</p></blockquote>';
    }
    return '<p>' + inline(block).replace(/\n/g, ' ') + '</p>';
  }).join('\n');
}

/* ---------- saved state (fails quietly if storage is blocked) ---------- */
function load() {
  try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; }
}
function save(patch) {
  const s = Object.assign(load(), patch);
  try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) {}
  return s;
}
function loadPrefs() {
  const s = load();
  if (s.theme) document.documentElement.setAttribute('data-theme', s.theme);
  if (s.fs) document.documentElement.style.setProperty('--fs', s.fs + 'rem');
}
loadPrefs();

/* ---------- reading-time nudge ---------- */
let readingSeconds = 0, lastTick = null, nudgeTimer = null;
const nudge = document.getElementById('nudge');
document.getElementById('nudge-ok').addEventListener('click', () => { nudge.hidden = true; });
function startNudgeClock() {
  stopNudgeClock();
  if (!BOOK.breakEveryMinutes) return;
  nudgeTimer = setInterval(() => {
    if (document.hidden) return;
    readingSeconds += 5;
    if (readingSeconds >= BOOK.breakEveryMinutes * 60) {
      readingSeconds = 0;
      nudge.hidden = false;
    }
  }, 5000);
}
function stopNudgeClock() { if (nudgeTimer) clearInterval(nudgeTimer); nudgeTimer = null; nudge.hidden = true; }

/* ---------- views ---------- */
let scrollHandler = null;
function clearScroll() {
  if (scrollHandler) window.removeEventListener('scroll', scrollHandler);
  scrollHandler = null;
}

function renderHome() {
  clearScroll(); stopNudgeClock();
  document.title = BOOK.title;
  const s = load();
  const done = s.done || [];
  let resume = '';
  if (typeof s.last === 'number' && chapters[s.last] && !(done.includes(s.last) && s.pos == null)) {
    resume = '<button class="resume" id="resume" type="button"><b>Continue reading</b><span>' +
      esc(chapters[s.last].title) + '</span></button>';
  }
  const rows = chapters.map(c =>
    '<li><button type="button" data-ch="' + c.i + '" class="' + (done.includes(c.i) ? 'done' : '') + '">' +
    '<span class="n">' + (c.i + 1) + '</span>' +
    '<span class="t">' + esc(c.title) + '</span>' +
    '<span class="m">' + (done.includes(c.i) ? 'Read' : c.minutes + ' min') + '</span></button></li>'
  ).join('');
  $app.innerHTML =
    '<main class="wrap home">' +
      '<h1>' + esc(BOOK.title) + '</h1>' +
      (BOOK.author ? '<p class="author">' + esc(BOOK.author) + '</p>' : '') +
      '<p class="intro">' + esc(BOOK.intro) + '</p>' +
      resume +
      '<ul class="toc">' + rows + '</ul>' +
      '<p class="note">One chapter at a time. There is no feed here, nothing loads automatically, and each chapter ends so you can stop.</p>' +
    '</main>';
  $app.querySelectorAll('[data-ch]').forEach(b => b.addEventListener('click', () => go(+b.dataset.ch)));
  const r = document.getElementById('resume');
  if (r) r.addEventListener('click', () => go(s.last));
  window.scrollTo(0, 0);
}

function renderChapter(i) {
  const c = chapters[i];
  if (!c) return renderHome();
  clearScroll();
  document.title = c.title + ' · ' + BOOK.title;
  const next = chapters[i + 1];
  const s = load();

  $app.innerHTML =
    '<header class="bar ui">' +
      '<div class="bar-row">' +
        '<button type="button" id="back" aria-label="Back to contents">‹ Contents</button>' +
        '<span class="left-label" id="left" aria-live="off"></span>' +
        '<div class="tools">' +
          '<button type="button" id="smaller" aria-label="Smaller text">A−</button>' +
          '<button type="button" id="bigger" aria-label="Larger text">A+</button>' +
          '<button type="button" id="theme" aria-label="Switch light or dark">◐</button>' +
        '</div>' +
      '</div>' +
      '<div class="progress"><i id="fill"></i></div>' +
    '</header>' +
    '<article class="wrap">' +
      '<div class="chapter-head">' +
        '<p class="kicker">Chapter ' + (i + 1) + ' of ' + chapters.length + ' · ' + c.minutes + ' min read</p>' +
        '<h1>' + esc(c.title) + '</h1>' +
      '</div>' +
      '<div class="body">' + bodyHtml(c.text) + '</div>' +
      '<section class="pause" aria-label="End of chapter">' +
        '<h2>That’s the end of this chapter.</h2>' +
        '<p class="sub">Look up from the screen for a moment. Let it settle before you go on.</p>' +
        (c.reflect ? '<div class="reflect"><small>Something to think about</small><p>' + esc(c.reflect) + '</p></div>' : '') +
        '<div class="actions">' +
          (next ? '<button class="btn primary" type="button" id="next">Next: ' + esc(next.title) + '</button>' : '<p class="finish">You’ve reached the end of what’s here so far. More is on the way.</p>') +
          '<button class="btn" type="button" id="toc">Back to contents</button>' +
        '</div>' +
      '</section>' +
    '</article>';

  document.getElementById('back').addEventListener('click', () => go(null));
  document.getElementById('toc').addEventListener('click', () => go(null));
  if (next) document.getElementById('next').addEventListener('click', () => go(i + 1));

  document.getElementById('smaller').addEventListener('click', () => size(-0.1));
  document.getElementById('bigger').addEventListener('click', () => size(0.1));
  document.getElementById('theme').addEventListener('click', toggleTheme);

  const fill = document.getElementById('fill');
  const left = document.getElementById('left');
  let saveT = null;
  function update() {
    const max = document.documentElement.scrollHeight - window.innerHeight;
    const p = max > 0 ? Math.min(1, Math.max(0, window.scrollY / max)) : 1;
    fill.style.width = (p * 100) + '%';
    const mins = Math.ceil(c.minutes * (1 - p));
    left.textContent = p > 0.97 ? 'Done' : mins + ' min left';
    clearTimeout(saveT);
    saveT = setTimeout(() => {
      const st = load();
      const done = st.done || [];
      if (p > 0.97 && !done.includes(i)) done.push(i);
      save({ last: i, pos: p > 0.97 ? null : p, done });
    }, 400);
  }
  scrollHandler = update;
  window.addEventListener('scroll', update, { passive: true });

  save({ last: i });
  window.scrollTo(0, 0);
  if (s.last === i && typeof s.pos === 'number' && s.pos > 0.02) {
    requestAnimationFrame(() => {
      const max = document.documentElement.scrollHeight - window.innerHeight;
      window.scrollTo(0, s.pos * max);
      update();
    });
  } else update();
  startNudgeClock();
}

function size(d) {
  const cur = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--fs')) || 1.1;
  const v = Math.min(1.7, Math.max(0.95, +(cur + d).toFixed(2)));
  document.documentElement.style.setProperty('--fs', v + 'rem');
  save({ fs: v });
}
function toggleTheme() {
  const root = document.documentElement;
  const isDark = root.getAttribute('data-theme') === 'dark' ||
    (!root.getAttribute('data-theme') && matchMedia('(prefers-color-scheme: dark)').matches);
  const t = isDark ? 'light' : 'dark';
  root.setAttribute('data-theme', t);
  save({ theme: t });
}

/* ---------- routing: #/ is contents, #/2 is chapter 2 ---------- */
function go(i) { location.hash = (i === null) ? '#/' : '#/' + (i + 1); }
function route() {
  const m = location.hash.match(/^#\/(\d+)$/);
  if (m) renderChapter(+m[1] - 1); else renderHome();
}
window.addEventListener('hashchange', route);
route();
</script>
</body>
</html>
